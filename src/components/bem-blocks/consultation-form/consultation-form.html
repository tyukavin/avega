<section class="consultation-form" id="consultation" aria-labelledby="consultation-title">
    <div class="consultation-form__intro">
        <h2 class="consultation-form__title" id="consultation-title">
            Опишите ситуацию —<br>и мы вам поможем
        </h2>
        <div class="consultation-form__contacts">
            <a class="consultation-form__phone" href="tel:+79128352345">+7&nbsp;(912)&nbsp;835&#8209;23&#8209;45</a>
            <a class="consultation-form__messenger" href="https://t.me/avega45">Написать в Telegram</a>
        </div>
    </div>
    <form class="consultation-form__form" action="#" method="post">
        <label class="consultation-form__field">
            <span class="visually-hidden">Ваше имя</span>
            <input type="text" name="name" autocomplete="name" placeholder="Ваше имя" required>
        </label>
        <label class="consultation-form__field">
            <span class="visually-hidden">Телефон</span>
            <input type="tel" name="phone" autocomplete="tel" placeholder="Телефон" required>
        </label>
        <label class="consultation-form__field consultation-form__field--wide">
            <span class="visually-hidden">Кратко опишите ситуацию</span>
            <textarea name="message" rows="3" placeholder="Кратко опишите ситуацию"></textarea>
        </label>
        <label class="consultation-form__agreement">
            <input type="checkbox" name="agreement" required>
            <span>Я согласен на обработку персональных данных</span>
        </label>
        <button class="consultation-form__submit" type="submit">Отправить заявку</button>
    </form>
</section>
